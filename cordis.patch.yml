# dsh-knowledge-cards bundle patch: inserts the dual-face plugin row into the
# web profile roster. The node half (exports ".") runs in the host process
# (knowledge-base store + /api/dsh-knowledge/* routes + wiki_* agent tools);
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client") load in the web GUI.
- insert:
    - id: ui-dsh-knowledge-cards
      name: '@amberyang1106/dsh-knowledge-cards'
